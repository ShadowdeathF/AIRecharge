name: Verify application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
      - name: Test and package API
        run: mvn -B -ntp -f apps/api/pom.xml -Dspring.mail.host=127.0.0.1 -Dspring.mail.username=ci@example.invalid -Dmail.enabled=false package
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install -g pnpm@10.29.3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm build:web
      - name: Check TypeScript
        run: pnpm --filter @orion-key/web exec tsc --noEmit
